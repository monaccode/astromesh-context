name: Release
on:
  push:
    tags: ["v*"]
  # Re-run a release from main, e.g. to put an already-published version on TestPyPI.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv sync --locked
      - run: >-
          uv run pytest -q
          --ignore=tests/test_source_rag.py --ignore=tests/test_source_okf.py
          --ignore=tests/integrations --ignore=tests/test_docs_examples.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # TestPyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/checkout@v4 # only for `uv version`
      - name: Install from TestPyPI and build a window
        run: |
          VERSION="$(uv version --short)"
          uv venv -q /tmp/smoke
          export VIRTUAL_ENV=/tmp/smoke
          # The package only from TestPyPI (--no-deps), its dependencies from PyPI.
          # TestPyPI indexes with a delay, so retry; `ok` makes a run that never
          # succeeds fail here instead of passing on the last `sleep`.
          for i in 1 2 3 4 5 6; do
            uv pip install -q --no-deps --index-url https://test.pypi.org/simple/ \
              "astromesh-context==${VERSION}" && ok=1 && break
            echo "astromesh-context==${VERSION} not on TestPyPI yet; retrying in 30s"
            sleep 30
          done
          test "${ok:-}" = 1 || { echo "::error::astromesh-context==${VERSION} never became installable from TestPyPI"; exit 1; }
          uv pip install -q "pyyaml>=6.0"
          cd /tmp
          /tmp/smoke/bin/python -c "
          import asyncio, astromesh_context as ac
          assert ac.__version__ == '${VERSION}', ac.__version__
          engine = ac.ContextEngine([ac.StaticSource('rules', pinned=True)], budget=100)
          window = asyncio.run(engine.build('hello'))
          assert window.items and window.items[0].pinned
          print(window.to_text())
          "
          /tmp/smoke/bin/astromesh-context --help > /dev/null

  pypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
