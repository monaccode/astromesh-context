name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: >-
          uv run --python ${{ matrix.python }} pytest -q
          --ignore=tests/test_source_rag.py --ignore=tests/test_source_okf.py
          --ignore=tests/integrations --ignore=tests/test_docs_examples.py
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { extra: rag, test: test_source_rag.py }
          - { extra: okf, test: test_source_okf.py }
          - { extra: langchain, test: integrations/test_langchain.py }
          - { extra: pydantic-ai, test: integrations/test_pydantic_ai.py }
          - { extra: mcp, test: integrations/test_mcp.py }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra ${{ matrix.extra }} --python 3.12
      - run: uv run --python 3.12 pytest -q tests/${{ matrix.test }}
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra rag --extra okf --python 3.12
      - run: >-
          uv run --python 3.12 pytest -q tests/test_eval_metrics.py tests/test_eval_smoke.py tests/test_cli.py
          tests/test_docs_examples.py
