[project]
name = "astromesh-context"
version = "0.1.0"
description = "A context-window engine for AI agents: scored selection under a token budget, cache-stable ordering, a decision trace and an eval to measure it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Romero", email = "jc@fulfaro.dev" }]
keywords = ["context","context-window","llm","agents","rag","token-budget","prompt-caching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
rag = ["astromesh-rag>=0.1,<0.2"]
okf = ["astromesh-okf>=0.1,<0.2"]
tiktoken = ["tiktoken>=0.7"]
llm = ["httpx>=0.27"]
langchain = ["langchain>=1.0", "langchain-core>=1.6"]
pydantic-ai = ["pydantic-ai-slim>=2.55; python_version >= '3.11'"]
mcp = ["mcp>=2.3"]
eval = ["astromesh-rag[sentence-transformers]>=0.1,<0.2", "httpx>=0.27"]

[project.scripts]
astromesh-context = "astromesh_context.cli:main"

[project.urls]
Homepage = "https://github.com/monaccode/astromesh-context"
Issues = "https://github.com/monaccode/astromesh-context/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "ruff>=0.16", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["astromesh_context", "tests", "docs", "README*.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["uv.lock", ".superpowers", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["astromesh_context"]

[tool.uv.sources]
# astromesh-rag is not on PyPI yet; remove once it is published.
astromesh-rag = { git = "https://github.com/monaccode/astromesh-rag", tag = "v0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
# ruff 0.16 formats code blocks inside Markdown; docs keep their aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "C4", "SIM", "RET", "PERF", "PIE", "DTZ", "LOG", "G", "PT", "N", "PTH", "RUF", "BLE", "PLE", "PLW"]
